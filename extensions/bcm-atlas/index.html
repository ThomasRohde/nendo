<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Capability Atlas</title><link rel="stylesheet" href="view.css"></head>
<body>
<header class="toolbar">
  <div class="view-tabs" aria-label="View"><button data-mode="map" aria-pressed="true">Map</button><button data-mode="assessment" aria-pressed="false">Assessment</button><button data-mode="outline" aria-pressed="false">Outline</button><button data-mode="portfolio" aria-pressed="false" data-needs="importance health">Importance × health</button></div>
  <div class="level-control"><span id="levels-label">Levels</span><div id="levels" role="group" aria-labelledby="levels-label"></div></div>
  <input id="search" type="search" placeholder="Find a capability…" aria-label="Find a capability">
  <label class="control">Colour <select id="colour"><option value="maturity">Maturity</option><option value="gap">Maturity gap</option><option value="change">Change since</option><option value="importance">Importance</option><option value="investment">Investment</option><option value="none">Neutral</option></select></label>
  <label class="control" id="since-control" hidden>Since <select id="since" aria-label="Change since"></select></label>
  <button id="add" class="primary">+ Capability</button>
</header>
<section class="metrics" aria-label="Model summary"><div><strong id="total">—</strong><span>capabilities</span></div><div><strong id="leaves">—</strong><span>at the delivery level</span></div><div data-needs="maturity target"><strong id="gaps">—</strong><span>below target</span></div><div data-needs="maturity"><strong id="unassessed">—</strong><span>awaiting assessment</span></div><div class="model-label" id="banner" hidden><span id="banner-title"></span><small id="banner-note"></small></div></section>
<div class="subbar"><nav id="breadcrumbs" aria-label="Capability scope"></nav><div class="map-tools"><label class="control">Layout <select id="layout"><option value="compact">Reference · compact</option><option value="ordered">Reference · ordered</option></select></label><button id="pan-tool" aria-pressed="false" title="Drag anywhere to pan. Ctrl-drag also works without this tool.">Pan</button><button id="zoom-out" aria-label="Zoom out">−</button><button id="fit" title="Fit the map. Ctrl-drag anywhere to pan.">Fit</button><button id="zoom-in" aria-label="Zoom in">+</button><output id="zoom">100%</output><details class="export-menu" id="export"><summary>Export</summary><div class="export-options" role="group" aria-label="Export the map"><button type="button" data-export="svg">SVG, to edit</button><button type="button" data-export="png">PNG, for a slide</button><label><input type="checkbox" id="export-light"> Light colours for print</label></div></details></div></div>
<div id="notice" role="status" hidden></div>
<main><section id="workspace" aria-label="Capability model"><div id="map" tabindex="0" aria-label="Capability map. Use Pan, Ctrl-drag anywhere, or drag the background to pan; use plus, minus or Fit to zoom."><div id="drawing"></div></div><div id="table" hidden></div><div id="portfolio" hidden></div><div id="empty" hidden><h2>A clear picture starts with one capability.</h2><p>Add a top-level business capability, then build out its children.</p><button id="empty-add" class="primary">Create a capability</button></div></section><aside id="inspector" aria-label="Capability inspector"></aside></main>
<footer><div id="legend"></div><span id="status" role="status">Connecting to your model…</span></footer>
<dialog id="editor"><form id="edit-form"><div class="dialog-title"><div><small id="edit-eyebrow">CAPABILITY</small><h2 id="edit-title">New capability</h2></div><button type="button" id="close-editor" aria-label="Close editor">×</button></div><div class="form-grid"><label class="full">Name<input name="name" required maxlength="180"></label><label data-needs="code">Reference<input name="code" maxlength="40"></label><label data-needs="owner">Accountable owner<input name="owner" maxlength="120"></label><label class="full" data-needs="parent">Parent capability<select name="parent"></select></label><label class="full" data-needs="description">Definition<textarea name="description" rows="3" maxlength="4000"></textarea></label><label data-needs="maturity-stored">Maturity<select name="maturity"></select></label><label data-needs="target">Target maturity<select name="target"></select></label><label data-needs="importance">Strategic importance<select name="importance"></select></label><label data-needs="investment">Investment direction<select name="investment"></select></label><label data-needs="lifecycle">Lifecycle<select name="lifecycle"></select></label><label data-needs="reviewed">Review date<input name="reviewed" type="date"></label><label class="full" data-needs="evidence">Assessment evidence<textarea name="evidence" rows="2" maxlength="4000"></textarea></label></div><p id="form-error" role="alert"></p><div class="dialog-actions"><button type="button" id="cancel-editor">Cancel</button><button type="submit" class="primary" id="save">Save capability</button></div></form></dialog>
<script src="/_nendo/api.js"></script><script src="layout.js"></script><script type="module" src="view.js"></script>
</body></html>
