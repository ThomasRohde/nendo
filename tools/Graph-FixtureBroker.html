<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Custom view fixture broker</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#7f7f7f}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<script>
// The Workbench's side of a custom view's protocol (ADR-0013), answered from fixture data for
// the package measurement lanes. Graph-FixtureServer.mjs serves this page on one origin and the
// package on another, so a view meets what it meets in Nendo: a cross-origin frame whose only
// way in is window.nendo, connected by a hello, a connect carrying its context and one end of a
// MessageChannel, and then requests and events on that port, as
// src/Nendo.Workbench/src/extension-api/protocol.ts describes them.
//
// A probe drives it through window.broker:
//   setFixture({ context, schema, records, commandEffects })   what the view reads, and what each
//                                              record command sets; mounts the frame the first time
//   pushChanges(), pushTheme(mode | theme), pushContext()   the three events a view hears
//   fail(method, { code, message }, times)     refuse the next requests of one method
//   remount()                                   a fresh frame, as a new placeholder would start one
//   requests, events, hellos, refused, connects what happened, in order
(() => {
  'use strict';
  const config = '__FIXTURE_CONFIG__';
  // The frame's sandbox, as src/Nendo.Workbench/src/view-frame-markup.ts sets it.
  const SANDBOX = 'allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads allow-modals allow-pointer-lock allow-presentation';
  // The methods this fixture answers, which is what the context lists and nendo.has reads.
  const METHODS = ['schema.describe', 'records.query', 'records.get', 'ui.openRecord', 'commands.run'];
  // The Workbench's colour tokens for both themes, as src/Nendo.Workbench/src/styles/02-tokens.css
  // declares them and extension-model.ts names them.
  const themes = {
    light: {
      canvas: '#f3f4f6', surface: '#ffffff', 'surface-raised': '#ffffff', 'surface-soft': '#f1f2f5', ink: '#14171c',
      muted: '#5b6370', line: '#e2e5ea', 'line-strong': '#cdd2da', cobalt: '#6b3fd6', 'cobalt-soft': '#efe9fd',
      violet: '#8a4fd8', healthy: '#1a7f51', warning: '#9c6400', danger: '#c23a31',
      shadow: '0 1px 2px rgba(20, 23, 28, 0.05), 0 12px 32px -16px rgba(20, 23, 28, 0.18)',
      'tone-red': '#c93a3a', 'tone-orange': '#c75a17', 'tone-amber': '#a37608', 'tone-green': '#1f8a52',
      'tone-teal': '#16837e', 'tone-blue': '#2f63d6', 'tone-violet': '#7446d4', 'tone-grey': '#677080',
    },
    dark: {
      canvas: '#0f1115', surface: '#14171c', 'surface-raised': '#181b21', 'surface-soft': '#1c2027', ink: '#e7e9ed',
      muted: '#9aa1ad', line: '#262a33', 'line-strong': '#353b47', cobalt: '#9d6bff', 'cobalt-soft': '#251c3a',
      violet: '#c29bff', healthy: '#46d08f', warning: '#e9b659', danger: '#f37b72',
      shadow: '0 1px 0 rgba(255, 255, 255, 0.02), 0 20px 48px -16px rgba(0, 0, 0, 0.7)',
      'tone-red': '#f27a7a', 'tone-orange': '#f29a5c', 'tone-amber': '#e8c15a', 'tone-green': '#52d18f',
      'tone-teal': '#4ecdc4', 'tone-blue': '#6f9bff', 'tone-violet': '#b392ff', 'tone-grey': '#a3abb8',
    },
  };
  const requests = [], events = [], hellos = [], refused = [], pongs = [], failures = [];
  let fixture = null, frame = null, port = null, connects = 0, nextPing = 1;

  const clone = value => JSON.parse(JSON.stringify(value));
  const now = () => Math.round(performance.now());
  const themeOf = value => typeof value === 'string' ? { mode: value, tokens: { ...themes[value] } } : clone(value);

  function contextOf() {
    const context = fixture.context;
    return {
      apiVersion: config.apiVersion, packageId: config.packageId, configuration: {}, locale: 'en', readOnly: false,
      ...clone(context), theme: themeOf(context.theme ?? 'light'), methods: [...METHODS],
    };
  }

  function post(message) {
    if (port !== null) port.postMessage(message);
  }

  function emit(name, data) {
    events.push({ n: name, t: now(), at: requests.length });
    post({ t: 'evt', n: name, d: data });
  }

  function refusal(code, message) {
    return Object.assign(new Error(message), { code });
  }

  function text(params, key) {
    const value = params[key];
    if (typeof value !== 'string' || value.length === 0 || value.length > 256)
      throw refusal('invalid-params', `${key} must be text of 1 to 256 characters.`);
    return value;
  }

  /** One request, answered from the fixture as the Workbench's broker answers it from the file. */
  function answer(method, params) {
    const failure = failures.findIndex(entry => entry.method === method);
    if (failure !== -1) {
      const entry = failures[failure];
      entry.times -= 1;
      if (entry.times <= 0) failures.splice(failure, 1);
      throw refusal(entry.error.code, entry.error.message);
    }
    switch (method) {
      case 'schema.describe':
        return { purpose: null, screens: [], commands: [], ...clone(fixture.schema), changeSequence: fixture.changeSequence };
      case 'records.query': {
        const entityId = text(params, 'entityId');
        const limit = params.limit ?? 100;
        if (!Number.isInteger(limit) || limit < 1 || limit > 200) throw refusal('invalid-params', 'limit must be a whole number from 1 to 200.');
        let start = 0;
        if (params.cursor !== undefined && params.cursor !== null) {
          // A cursor names the change it was read at: after the file moves, it is stale.
          const match = /^(\d+):(\d+)$/.exec(String(params.cursor));
          if (match === null) throw refusal('invalid-cursor', 'That cursor is not one this file gave.');
          if (Number(match[1]) !== fixture.changeSequence) throw refusal('stale-cursor', 'The file changed since that page was read.');
          start = Number(match[2]);
        }
        const all = fixture.records[entityId] ?? [];
        const end = Math.min(all.length, start + limit);
        return { items: clone(all.slice(start, end)), nextCursor: end < all.length ? `${fixture.changeSequence}:${end}` : null, changeSequence: fixture.changeSequence };
      }
      case 'records.get': {
        const entityId = text(params, 'entityId'), recordId = text(params, 'recordId');
        const record = (fixture.records[entityId] ?? []).find(candidate => candidate.recordId === recordId);
        return record === undefined ? null : clone(record);
      }
      case 'ui.openRecord':
        text(params, 'entityId');
        text(params, 'recordId');
        return { opened: true };
      case 'commands.run': {
        // As the host runs one: the command's steps set their fields on the record, but only at
        // the version the view read. A record somebody changed since is refused and left as it is.
        const commandId = text(params, 'commandId'), entityId = text(params, 'entityId'), recordId = text(params, 'recordId');
        if (!Number.isSafeInteger(params.version) || params.version < 1) throw refusal('invalid-params', 'version must be the record\u2019s version.');
        const effect = fixture.commandEffects?.[commandId];
        if (effect === undefined) throw refusal('command-unavailable', 'That command is not in this file.');
        const record = (fixture.records[entityId] ?? []).find(candidate => candidate.recordId === recordId);
        if (record === undefined) throw refusal('record-not-found', 'That record is not in this file.');
        if (record.version !== params.version) throw refusal('record-version-conflict', 'The record changed. Review its current values.');
        record.values = { ...record.values, ...clone(effect) };
        record.version += 1;
        fixture.changeSequence += 1;
        // Nendo tells every view the file changed, the one that wrote it included.
        queueMicrotask(() => emit('changes', fixture.changeSequence));
        return clone(record);
      }
      default:
        throw refusal('unknown-method', `${String(method).slice(0, 80)} is not a method this fixture answers.`);
    }
  }

  function receive(message) {
    if (typeof message !== 'object' || message === null) return;
    if (message.t === 'ping') { post({ t: 'pong', id: message.id }); return; }
    if (message.t === 'pong') { pongs.push(message.id); return; }
    if (message.t !== 'req' || typeof message.id !== 'number') return;
    const params = message.p ?? {};
    requests.push({ m: message.m, p: clone(params), t: now() });
    try {
      const result = answer(message.m, params);
      post({ t: 'res', id: message.id, ok: true, r: result === undefined ? null : result });
    } catch (error) {
      post({ t: 'res', id: message.id, ok: false, e: { code: error.code ?? 'failed', message: error.message } });
    }
  }

  function mount() {
    if (port !== null) { port.close(); port = null; }
    if (frame !== null) frame.remove();
    frame = document.createElement('iframe');
    frame.name = 'nendo-view-fixture';
    frame.title = fixture.context.title ?? 'Custom view';
    frame.setAttribute('sandbox', SANDBOX);
    frame.src = config.viewUrl;
    document.body.append(frame);
  }

  // Only the frame this page mounted, and only from the origin it was mounted at, is connected.
  window.addEventListener('message', event => {
    const data = event.data;
    if (typeof data !== 'object' || data === null || data.nendo !== 'hello') return;
    if (frame === null || event.source !== frame.contentWindow) { refused.push('not the mounted frame'); return; }
    if (event.origin !== config.viewOrigin) { refused.push('origin ' + event.origin); return; }
    hellos.push(data.apiVersion);
    if (port !== null) port.close();
    const channel = new MessageChannel();
    port = channel.port1;
    port.onmessage = message => receive(message.data);
    connects += 1;
    event.source.postMessage({ nendo: 'connect', apiVersion: config.apiVersion, context: contextOf() }, config.viewOrigin, [channel.port2]);
  });

  window.broker = Object.freeze({
    viewOrigin: config.viewOrigin,
    apiVersion: config.apiVersion,
    themes,
    requests, events, hellos, refused, pongs,
    get connects() { return connects; },
    /** Replace what the view reads. Each fixture is a new change of the file. The first one mounts the frame. */
    setFixture(next) {
      fixture = { ...clone(next), changeSequence: (fixture?.changeSequence ?? 0) + 1 };
      if (frame === null) mount();
      return fixture.changeSequence;
    },
    pushChanges() { emit('changes', fixture.changeSequence); return events.length; },
    /** A mode ('light' or 'dark') takes the Workbench's own tokens; an object is sent as it is. */
    pushTheme(theme) {
      const value = themeOf(theme);
      fixture.context = { ...fixture.context, theme: value };
      emit('theme', value);
      return events.length;
    },
    pushContext() { emit('context', contextOf()); return events.length; },
    fail(method, error, times = 1) { failures.push({ method, error: clone(error), times }); return true; },
    remount() { mount(); return true; },
    ping() { const id = nextPing++; post({ t: 'ping', id }); return id; },
    opened() { return requests.filter(request => request.m === 'ui.openRecord').map(request => request.p); },
    commandsRun() { return requests.filter(request => request.m === 'commands.run').map(request => request.p); },
    /** A record as the fixture now holds it, to see what a command did. */
    record(entityId, recordId) { return clone((fixture.records[entityId] ?? []).find(candidate => candidate.recordId === recordId) ?? null); },
    /** Somebody else changes a record: its version moves on under the view. */
    touch(entityId, recordId) {
      const record = (fixture.records[entityId] ?? []).find(candidate => candidate.recordId === recordId);
      record.version += 1; fixture.changeSequence += 1;
      return record.version;
    },
  });
})();
</script>
</body>
</html>
