<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Custom view fixture broker</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#7f7f7f}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<script type="module">
// The Workbench's own rules for a view's toolbar and menu (view-toolbar-model.ts), which
// Graph-FixtureServer.mjs builds and serves. A module runs after the page's own script and
// before its load event, so the rules are here before a probe mounts a view (W-091).
import { readToolbar, readMenu } from '/toolbar-rules.js';
window.toolbarRules = Object.freeze({ readToolbar, readMenu });
</script>
<script>
// The Workbench's side of a custom view's protocol (ADR-0013), answered from fixture data for
// the package measurement lanes. Graph-FixtureServer.mjs serves this page on one origin and the
// package on another, so a view meets what it meets in Nendo: a cross-origin frame whose only
// way in is window.nendo, connected by a hello, a connect carrying its context and one end of a
// MessageChannel, and then requests and events on that port, as
// src/Nendo.Workbench/src/extension-api/protocol.ts describes them.
//
// A probe drives it through window.broker:
//   setFixture({ context, schema, records, commandEffects })   what the view reads, and what each
//                                              record command sets; mounts the frame the first time
//   pushChanges(), pushTheme(mode | theme), pushContext()   the three events a view hears
//   fail(method, { code, message }, times)     refuse the next requests of one method
//   hold(method, ms, times)                     answer the next requests of one method late: a
//                                               write is kept at once, its answer arrives ms later
//   drop(method, { code, message }, times)      keep the next requests of one method, then answer
//                                               them with this error, as a reply lost on the way
//   remount()                                   a fresh frame, as a new placeholder would start one
//   offerWrites(on)                             offer records.create, records.delete, records.batch,
//                                               records.undo and records.redo from the next connect on
//                                               (W-109, W-103); each answers as the host writes,
//                                               versions, references and deletion history all
//   offerChrome(on)                             offer ui.setToolbar and ui.showMenu from the next
//                                               connect on (W-090); toolbars and menus record them,
//                                               and chromeRefusals what Nendo's rules refused (W-091)
//   pickNext(pick), command(id, value, source)  the next menu's answer; a press on the toolbar
//   offerSearch(on)                             offer records.search from the next connect on (ADR-0028):
//                                               every word in any text value of a record, the last
//                                               word also as a prefix, a field's excerpt with ranges
//   offerPlaces(on), places, pushPlace(place),   ui.setPlace from the next connect on (W-127): what
//   startAt(place)                              the view declared, Back or Forward handing it a
//                                               place, and the place the next connect starts at
//   put(entityId, record), touch(entityId, id)  somebody else writes a record, or moves its version on
//   requests, events, hellos, refused, connects what happened, in order
(() => {
  'use strict';
  const config = '__FIXTURE_CONFIG__';
  // The frame's sandbox, as src/Nendo.Workbench/src/view-frame-markup.ts sets it.
  const SANDBOX = 'allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads allow-modals allow-pointer-lock allow-presentation';
  // And the features it delegates, as view-frame-markup.ts's frameAllow: the clipboard among them (W-123).
  const ALLOW = 'clipboard-read; clipboard-write; fullscreen; web-share; autoplay; encrypted-media; picture-in-picture; geolocation';
  // The methods this fixture answers, which is what the context lists and nendo.has reads.
  const METHODS = ['schema.describe', 'records.query', 'records.get', 'records.tree', 'records.update', 'records.move', 'ui.openRecord', 'commands.run'];
  // A view's controls in Nendo's own chrome (W-090), offered only when a probe asks, so each
  // lane measures a view both on a host that draws its controls and on one that does not.
  const CHROME = ['ui.setToolbar', 'ui.showMenu'];
  let chrome = false, menuPick = null;
  // Record writes beyond an update, offered only when a probe asks (W-109), so the lanes that pin
  // the methods a view is offered keep measuring what they always measured.
  const WRITES = ['records.create', 'records.delete', 'records.batch', 'records.undo', 'records.redo'];
  let writes = false;
  // What the Engine keeps of a deleted record (ADR-0023): its ID stays reserved, a create of it is
  // refused, and only an undo puts it back. The batches this frame wrote, and their undos and redos,
  // each with what it did, so an undo reverses it as the Engine compensates a revision.
  let deletedIds = new Map(), revisions = new Map(), nextRevision = 1;
  // A search of the file's text (ADR-0028), offered only when a probe asks, so the lanes that pin the
  // methods a view is offered keep measuring what they always measured.
  const SEARCH = ['records.search'];
  let searchOffered = false;
  // A view's place in Back and Forward (W-127), offered only when a probe asks.
  const PLACES = ['ui.setPlace'];
  // Opening another screen of the file (ui.openScreen), offered only when a probe asks, so the lanes
  // that measure a view on a host without it keep measuring that.
  const SCREENS = ['ui.openScreen'];
  let screensOffered = false;
  let placesOffered = false, startPlace = null;
  const places = [];
  const toolbars = [], menus = [], chromeRefusals = [];
  // A declaration is read by the Workbench's own rules before it is recorded, and refused as
  // Nendo refuses it, so a lane never passes a toolbar or a menu that Nendo would not draw.
  function byNendosRules(method, read, params) {
    const rules = window.toolbarRules;
    if (rules === undefined) throw refusal('failed', 'The fixture has not loaded the Workbench’s toolbar rules.');
    try { rules[read](params); } catch (error) {
      chromeRefusals.push({ method, code: error.code ?? 'failed', message: error.message });
      throw refusal(error.code ?? 'failed', error.message);
    }
  }
  // The Workbench's colour tokens for both themes, as src/Nendo.Workbench/src/styles/02-tokens.css
  // declares them and extension-model.ts names them.
  const themes = {
    light: {
      canvas: '#f9f9fa', surface: '#ffffff', 'surface-raised': '#ffffff', 'surface-soft': '#f3f3f4', ink: '#1b1b1b',
      muted: '#5d5d5d', line: '#e5e5e5', 'line-strong': '#d1d1d1', cobalt: '#005fb8', 'cobalt-soft': '#e5eff9',
      violet: '#005fb8', healthy: '#1a7f51', warning: '#9c6400', danger: '#c23a31',
      shadow: '0 1px 2px rgba(20, 23, 28, 0.05), 0 12px 32px -16px rgba(20, 23, 28, 0.18)',
      'tone-red': '#c93a3a', 'tone-orange': '#c75a17', 'tone-amber': '#a37608', 'tone-green': '#1f8a52',
      'tone-teal': '#16837e', 'tone-blue': '#2f63d6', 'tone-violet': '#7446d4', 'tone-grey': '#677080',
    },
    dark: {
      canvas: '#272829', surface: '#2d2e30', 'surface-raised': '#323335', 'surface-soft': '#38393b', ink: '#ffffff',
      muted: '#c5c5c5', line: '#3b3c3e', 'line-strong': '#4b4c4f', cobalt: '#60cdff', 'cobalt-soft': '#1f3a4a',
      violet: '#60cdff', healthy: '#46d08f', warning: '#e9b659', danger: '#f37b72',
      shadow: '0 1px 0 rgba(255, 255, 255, 0.02), 0 20px 48px -16px rgba(0, 0, 0, 0.7)',
      'tone-red': '#f27a7a', 'tone-orange': '#f29a5c', 'tone-amber': '#e8c15a', 'tone-green': '#52d18f',
      'tone-teal': '#4ecdc4', 'tone-blue': '#6f9bff', 'tone-violet': '#b392ff', 'tone-grey': '#a3abb8',
    },
  };
  const requests = [], events = [], hellos = [], refused = [], pongs = [], failures = [], holds = [], drops = [];
  // A batch's writeKey and what it was answered: the same key and writes again answer the same,
  // the same key with other writes is refused, as the host's idempotency key does.
  const keyed = new Map();
  let fixture = null, frame = null, port = null, connects = 0, nextPing = 1;

  const clone = value => JSON.parse(JSON.stringify(value));
  const now = () => Math.round(performance.now());
  const themeOf = value => typeof value === 'string' ? { mode: value, tokens: { ...themes[value] } } : clone(value);

  function contextOf() {
    const context = fixture.context;
    return {
      apiVersion: config.apiVersion, packageId: config.packageId, configuration: {}, locale: 'en', readOnly: false,
      ...clone(context), theme: themeOf(context.theme ?? 'light'),
      methods: [...METHODS, ...(writes ? WRITES : []), ...(chrome ? CHROME : []), ...(placesOffered ? PLACES : []), ...(searchOffered ? SEARCH : []), ...(screensOffered ? SCREENS : [])],
      ...(placesOffered ? { place: clone(startPlace) } : {}),
    };
  }

  function post(message) {
    if (port !== null) port.postMessage(message);
  }

  function emit(name, data) {
    events.push({ n: name, t: now(), at: requests.length });
    post({ t: 'evt', n: name, d: data });
  }

  function refusal(code, message) {
    return Object.assign(new Error(message), { code });
  }

  function text(params, key) {
    const value = params[key];
    if (typeof value !== 'string' || value.length === 0 || value.length > 256)
      throw refusal('invalid-params', `${key} must be text of 1 to 256 characters.`);
    return value;
  }

  /** One request, answered from the fixture as the Workbench's broker answers it from the file. */
  function answer(method, params) {
    const failure = failures.findIndex(entry => entry.method === method);
    if (failure !== -1) {
      const entry = failures[failure];
      entry.times -= 1;
      if (entry.times <= 0) failures.splice(failure, 1);
      throw refusal(entry.error.code, entry.error.message);
    }
    switch (method) {
      case 'schema.describe':
        return { purpose: null, screens: [], commands: [], ...clone(fixture.schema), changeSequence: fixture.changeSequence };
      case 'records.query': {
        const entityId = text(params, 'entityId');
        const limit = params.limit ?? 100;
        if (!Number.isInteger(limit) || limit < 1 || limit > 200) throw refusal('invalid-params', 'limit must be a whole number from 1 to 200.');
        let start = 0;
        if (params.cursor !== undefined && params.cursor !== null) {
          // A cursor names the change it was read at: after the file moves, it is stale.
          const match = /^(\d+):(\d+)$/.exec(String(params.cursor));
          if (match === null) throw refusal('invalid-cursor', 'That cursor is not one this file gave.');
          if (Number(match[1]) !== fixture.changeSequence) throw refusal('stale-cursor', 'The file changed since that page was read.');
          start = Number(match[2]);
        }
        const all = fixture.records[entityId] ?? [];
        const end = Math.min(all.length, start + limit);
        return { items: clone(all.slice(start, end)), nextCursor: end < all.length ? `${fixture.changeSequence}:${end}` : null, changeSequence: fixture.changeSequence };
      }
      case 'records.search': {
        // The Engine's search, as plainly as a fixture can: every word must sit in some text value
        // of the record, the last as a prefix; a hit names each text field that holds a word, with
        // the whole value as its excerpt and the words found as ranges. Folded for case only.
        const query = text(params, 'text');
        const entityIds = Array.isArray(params.entityIds) && params.entityIds.length > 0 ? params.entityIds : Object.keys(fixture.records);
        const words = query.toLowerCase().replaceAll('"', ' ').split(/\s+/).filter(word => /[\p{L}\p{N}]/u.test(word));
        const required = words.filter(word => !word.startsWith('-'));
        const excluded = words.filter(word => word.startsWith('-')).map(word => word.slice(1));
        const tokens = value => [...String(value).matchAll(/[\p{L}\p{N}]+/gu)].map(match => ({ word: match[0].toLowerCase(), start: match.index, length: match[0].length }));
        const hits = [];
        for (const entityId of entityIds) {
          for (const record of fixture.records[entityId] ?? []) {
            const fields = Object.entries(record.values).filter(([, value]) => typeof value === 'string' && value.length > 0);
            const hitsIn = word => fields.some(([, value]) => tokens(value).some(token => word === required.at(-1) && !query.endsWith(' ') ? token.word.startsWith(word) : token.word === word));
            if (required.length === 0 || !required.every(hitsIn) || excluded.some(hitsIn)) continue;
            const matched = fields.map(([fieldId, value]) => ({ fieldId, snippet: value,
              ranges: tokens(value).filter(token => required.some(word => word === required.at(-1) ? token.word.startsWith(word) : token.word === word)).map(({ start, length }) => ({ start, length })) }))
              .filter(field => field.ranges.length > 0);
            hits.push({ entityId, recordId: record.recordId, version: record.version, label: fields[0]?.[1] ?? null, score: matched.length, fields: matched });
          }
        }
        hits.sort((a, b) => b.score - a.score || a.recordId.localeCompare(b.recordId));
        const limit = params.limit ?? 20;
        const start = typeof params.cursor === 'string' ? Number(params.cursor) : 0;
        return { items: clone(hits.slice(start, start + limit)), nextCursor: start + limit < hits.length ? String(start + limit) : null, changeSequence: fixture.changeSequence };
      }
      case 'records.tree': {
        // A declared hierarchy as the Engine walks it (ADR-0019): siblings by the order field, a
        // missing order last, then record ID; depth first. A fixture declares one per record type
        // under `hierarchies`; without it the refusal is the host's.
        const entityId = text(params, 'entityId');
        const hierarchy = fixture.hierarchies?.[entityId];
        if (hierarchy === undefined) throw refusal('hierarchy-not-declared', 'This record type declares no hierarchy to read as a tree.');
        const depth = params.depth ?? 1;
        const limit = params.limit ?? 100;
        const all = fixture.records[entityId] ?? [];
        const order = record => hierarchy.orderFieldId === null ? null : record.values[hierarchy.orderFieldId] ?? null;
        const sibling = (a, b) => (order(a) === null) - (order(b) === null) || (order(a) ?? 0) - (order(b) ?? 0) ||
          (a.recordId < b.recordId ? -1 : a.recordId > b.recordId ? 1 : 0);
        const under = parent => all.filter(record => (record.values[hierarchy.parentFieldId] ?? null) === parent).sort(sibling);
        const nodes = [];
        const visit = (parent, level) => {
          for (const record of under(parent)) {
            nodes.push({ record: clone(record), parentRecordId: parent, depth: level, childCount: under(record.recordId).length });
            if (level < depth) visit(record.recordId, level + 1);
          }
        };
        visit(params.rootRecordId ?? null, 1);
        let start = 0;
        if (params.cursor !== undefined && params.cursor !== null) {
          const match = /^(\d+):(\d+)$/.exec(String(params.cursor));
          if (match === null) throw refusal('invalid-cursor', 'That cursor is not one this file gave.');
          if (Number(match[1]) !== fixture.changeSequence) throw refusal('stale-cursor', 'The file changed since that page was read.');
          start = Number(match[2]);
        }
        const end = Math.min(nodes.length, start + limit);
        return { items: nodes.slice(start, end), nextCursor: end < nodes.length ? `${fixture.changeSequence}:${end}` : null, changeSequence: fixture.changeSequence };
      }
      case 'records.get': {
        const entityId = text(params, 'entityId'), recordId = text(params, 'recordId');
        const record = (fixture.records[entityId] ?? []).find(candidate => candidate.recordId === recordId);
        return record === undefined ? null : clone(record);
      }
      case 'ui.openRecord':
        text(params, 'entityId');
        text(params, 'recordId');
        return { opened: true };
      case 'ui.openScreen':
        if (!screensOffered) throw refusal('unknown-method', 'ui.openScreen is not a method this fixture answers.');
        text(params, 'surfaceId');
        return { opened: true };
      case 'ui.setToolbar':
        if (!chrome) throw refusal('unknown-method', 'ui.setToolbar is not a method this fixture answers.');
        byNendosRules(method, 'readToolbar', params);
        toolbars.push(clone(params));
        return null;
      case 'ui.setPlace': {
        if (!placesOffered) throw refusal('unknown-method', 'ui.setPlace is not a method this fixture answers.');
        const json = JSON.stringify(params.place ?? null);
        if (new TextEncoder().encode(json).length > 4096) throw refusal('invalid-params', 'place must be JSON of at most 4096 bytes.');
        if (params.label !== undefined && params.label !== null && (typeof params.label !== 'string' || params.label.length === 0 || params.label.length > 80))
          throw refusal('invalid-params', 'label must be text of 1 to 80 characters.');
        places.push({ place: JSON.parse(json), label: params.label ?? null, replace: params.replace === true, at: now() });
        return null;
      }
      case 'ui.showMenu': {
        if (!chrome) throw refusal('unknown-method', 'ui.showMenu is not a method this fixture answers.');
        byNendosRules(method, 'readMenu', params);
        menus.push(clone(params));
        const pick = menuPick;
        menuPick = null;
        return pick;
      }
      case 'records.update': {
        // As the host writes a person's edit: at the version the view read, or not at all.
        const entityId = text(params, 'entityId'), recordId = text(params, 'recordId');
        const record = (fixture.records[entityId] ?? []).find(candidate => candidate.recordId === recordId);
        if (record === undefined) throw refusal('record-not-found', 'That record is not in this file.');
        if (record.version !== params.version) throw refusal('record-version-conflict', 'The record changed. Review its current values.');
        if (typeof params.values !== 'object' || params.values === null) throw refusal('invalid-params', 'values must be an object.');
        record.values = { ...record.values, ...clone(params.values) };
        record.version += 1;
        fixture.changeSequence += 1;
        queueMicrotask(() => emit('changes', fixture.changeSequence));
        return clone(record);
      }
      case 'records.move': {
        // As the Engine's MoveRecordAsync moves (ADR-0019): the parent at the version the view
        // read, no loop, and with an order field a place before a sibling or last, taking the
        // middle of the gap, or a step of 1024 beyond the ends, or numbering the siblings afresh.
        const entityId = text(params, 'entityId'), recordId = text(params, 'recordId');
        const hierarchy = fixture.hierarchies?.[entityId];
        if (hierarchy === undefined) throw refusal('hierarchy-not-declared', 'This record type declares no hierarchy, so its records cannot be moved in one.');
        const all = fixture.records[entityId] ?? [];
        const byId = id => all.find(candidate => candidate.recordId === id);
        const record = byId(recordId);
        if (record === undefined) throw refusal('record-not-found', 'That record is not in this file.');
        if (record.version !== params.version) throw refusal('record-version-conflict', 'The record changed. Review its current values.');
        const parentOf = candidate => candidate.values[hierarchy.parentFieldId] ?? null;
        const parent = params.parentRecordId ?? null;
        if (parent !== null) {
          const target = byId(parent);
          if (target === undefined) throw refusal('record-not-found', 'The new parent is not in this file.');
          if (target.version !== params.parentVersion) throw refusal('target-version-conflict', 'The parent changed since the view read it.');
          for (let at = parent; at !== null; at = parentOf(byId(at))) {
            if (at === recordId) throw refusal('hierarchy-cycle', `${recordId} cannot be placed under itself.`);
          }
        }
        const writes = [];
        if (parentOf(record) !== parent) writes.push([record, hierarchy.parentFieldId, parent]);
        if (hierarchy.orderFieldId !== null) {
          const gap = 1024;
          const order = candidate => candidate.values[hierarchy.orderFieldId] ?? null;
          const siblings = all.filter(candidate => candidate !== record && parentOf(candidate) === parent)
            .sort((a, b) => (order(a) === null) - (order(b) === null) || (order(a) ?? 0) - (order(b) ?? 0) ||
              (a.recordId < b.recordId ? -1 : a.recordId > b.recordId ? 1 : 0));
          const before = params.beforeRecordId ?? null;
          const at = before === null ? siblings.length : siblings.findIndex(candidate => candidate.recordId === before);
          if (at < 0) throw refusal('hierarchy-sibling-not-found', `${before} is not a child of ${parent ?? 'the top level'}.`);
          const lower = at > 0 ? order(siblings[at - 1]) : null, upper = at < siblings.length ? order(siblings[at]) : null;
          const current = order(record);
          let placed = null;
          if (current !== null && (at === 0 || (lower !== null && lower < current)) && (at === siblings.length || (upper !== null && current < upper))) placed = current;
          else if (siblings.length === 0) placed = gap;
          else if (at === siblings.length) placed = lower === null ? null : lower + gap;
          else if (at === 0) placed = upper === null ? null : upper - gap;
          else placed = lower !== null && upper !== null && upper - lower >= 2 ? lower + Math.floor((upper - lower) / 2) : null;
          if (placed !== null) {
            if (placed !== current) writes.push([record, hierarchy.orderFieldId, placed]);
          } else {
            const ordered = [...siblings];
            ordered.splice(at, 0, record);
            ordered.forEach((candidate, index) => {
              if (order(candidate) !== (index + 1) * gap) writes.push([candidate, hierarchy.orderFieldId, (index + 1) * gap]);
            });
          }
        }
        if (writes.length === 0) throw refusal('move-unchanged', `${recordId} is already there.`);
        // One revision: each field set advances its record's version by one.
        for (const [candidate, fieldId, value] of writes) {
          candidate.values = { ...candidate.values, [fieldId]: value };
          candidate.version += 1;
        }
        fixture.changeSequence += 1;
        queueMicrotask(() => emit('changes', fixture.changeSequence));
        return clone(record);
      }
      case 'commands.run': {
        // As the host runs one: the command's steps set their fields on the record, but only at
        // the version the view read. A record somebody changed since is refused and left as it is.
        const commandId = text(params, 'commandId'), entityId = text(params, 'entityId'), recordId = text(params, 'recordId');
        if (!Number.isSafeInteger(params.version) || params.version < 1) throw refusal('invalid-params', 'version must be the record\u2019s version.');
        const effect = fixture.commandEffects?.[commandId];
        if (effect === undefined) throw refusal('command-unavailable', 'That command is not in this file.');
        const record = (fixture.records[entityId] ?? []).find(candidate => candidate.recordId === recordId);
        if (record === undefined) throw refusal('record-not-found', 'That record is not in this file.');
        if (record.version !== params.version) throw refusal('record-version-conflict', 'The record changed. Review its current values.');
        record.values = { ...record.values, ...clone(effect) };
        record.version += 1;
        fixture.changeSequence += 1;
        // Nendo tells every view the file changed, the one that wrote it included.
        queueMicrotask(() => emit('changes', fixture.changeSequence));
        return clone(record);
      }
      case 'records.create':
      case 'records.delete':
      case 'records.batch': {
        if (!writes) throw refusal('unknown-method', `${method} is not a method this fixture answers.`);
        const writeKey = method === 'records.batch' && typeof params.writeKey === 'string' ? params.writeKey : null;
        if (writeKey !== null && keyed.has(writeKey)) {
          const earlier = keyed.get(writeKey);
          if (earlier.writes !== JSON.stringify(params.writes)) throw refusal('idempotency-conflict', 'This writeKey already names a different batch.');
          return clone(earlier.answer);
        }
        // As the host writes them: each at the version the view read, a reference at its target's
        // version, a record other records point at never deleted, and a batch whole or not at all.
        const before = clone(fixture.records), deletedBefore = clone([...deletedIds]);
        try {
          const entries = method === 'records.batch' ? batchEntries(params)
            : [{ op: method === 'records.create' ? 'create' : 'delete', ...clone(params) }];
          const touched = new Map(), log = [];
          const answered = entries.map(entry => writeOne(entry, touched, log));
          fixture.changeSequence += 1;
          queueMicrotask(() => emit('changes', fixture.changeSequence));
          if (method === 'records.batch') {
            const result = { records: answered.map(record => ({ entityId: record.entityId, recordId: record.recordId, version: record.deleted ? null : record.version })), revision: remember(log, false) };
            if (writeKey !== null) keyed.set(writeKey, { writes: JSON.stringify(params.writes), answer: clone(result) });
            return result;
          }
          return method === 'records.delete' ? null : clone(answered[0]);
        } catch (error) {
          fixture.records = before;
          deletedIds = new Map(deletedBefore);
          throw error;
        }
      }
      case 'records.undo':
      case 'records.redo': {
        if (!writes) throw refusal('unknown-method', `${method} is not a method this fixture answers.`);
        // As the Engine compensates a revision: the opposite of each write, last first, against the
        // version the revision left; anything changed since refuses the whole step.
        const id = text(params, 'revision');
        const revision = revisions.get(id);
        if (revision === undefined) throw refusal('not-this-view', 'This view can undo only what it wrote since it opened.');
        if (method === 'records.redo' && !revision.undo) throw refusal('not-an-undo', 'Only an undo can be redone.');
        if (revision.reversed) throw refusal('compensation-not-supported', 'This revision already has a compensation revision.');
        const before = clone(fixture.records), deletedBefore = clone([...deletedIds]);
        try {
          const log = [];
          for (const write of [...revision.log].reverse()) reverseOne(write, log, carriedVersion(revision, write.recordId));
          revision.reversed = true;
          fixture.changeSequence += 1;
          queueMicrotask(() => emit('changes', fixture.changeSequence));
          const answered = new Map();
          for (const write of log) answered.set(write.recordId, { entityId: write.entityId, recordId: write.recordId, version: write.op === 'delete' ? null : write.version });
          return { records: [...answered.values()], revision: remember(log, true, id) };
        } catch (error) {
          fixture.records = before;
          deletedIds = new Map(deletedBefore);
          throw error;
        }
      }
      default:
        throw refusal('unknown-method', `${String(method).slice(0, 80)} is not a method this fixture answers.`);
    }
  }

  function batchEntries(params) {
    if (!Array.isArray(params.writes) || params.writes.length === 0 || params.writes.length > 200) throw refusal('invalid-params', 'writes must be a list of 1 to 200 record writes.');
    const seen = new Set();
    return params.writes.map((entry, index) => {
      if (!['create', 'update', 'delete'].includes(entry?.op)) throw refusal('invalid-params', `writes[${index}]: op must be create, update or delete.`);
      const recordId = entry.recordId ?? `record-${crypto.randomUUID().replaceAll('-', '')}`;
      if (seen.has(recordId)) throw refusal('invalid-params', `writes[${index}] writes ${recordId} again; put a record's changes in one write.`);
      seen.add(recordId);
      return { ...clone(entry), recordId };
    });
  }

  function remember(log, undo, of = null) {
    const id = `revision-${nextRevision++}`;
    revisions.set(id, { id, log, undo, of, reversed: false });
    return id;
  }

  /**
   * As the Engine reads it (ADR-0023): when every revision since `revision` that wrote the record
   * has been taken back -- each chain of a change and its undos and redos of even length -- the
   * record is as `revision` left it, at the version the last of them left. Otherwise undefined,
   * and the version the revision left is expected, so a change by anybody else refuses.
   */
  function carriedVersion(revision, recordId) {
    const later = [];
    let seen = false;
    for (const candidate of revisions.values()) {
      if (candidate === revision) { seen = true; continue; }
      if (seen && candidate.log.some(write => write.recordId === recordId)) later.push(candidate);
    }
    if (later.length === 0) return undefined;
    const last = [...later.at(-1).log].reverse().find(write => write.recordId === recordId);
    if (last.op === 'delete') return undefined;
    const members = new Set(later.map(candidate => candidate.id));
    for (const head of later.filter(candidate => !members.has(candidate.of))) {
      let length = 1;
      for (let link = head; ; length += 1) {
        const next = later.find(candidate => candidate.of === link.id);
        if (next === undefined) break;
        link = next;
      }
      if (length % 2 !== 0) return undefined;
    }
    return last.version;
  }

  /** Refused while another record points at this one, as the Engine refuses a delete. */
  function requireUnused(record) {
    for (const [otherType, others] of Object.entries(fixture.records)) {
      for (const other of others) {
        if (other === record) continue;
        if (referenceFields(otherType).some(fieldId => other.values[fieldId] === record.recordId))
          throw refusal('record-referenced', `${other.recordId} still points at ${record.recordId}.`);
      }
    }
  }

  /** Deletes a record and keeps it in deletion history, its ID reserved. */
  function deleteKept(entityId, record) {
    requireUnused(record);
    const list = fixture.records[entityId];
    list.splice(list.indexOf(record), 1);
    deletedIds.set(record.recordId, { entityId, version: record.version, values: clone(record.values), restored: false });
  }

  /** The opposite of one write of a revision being undone, logged as the undo's own write. */
  function reverseOne(write, log, carried) {
    const list = fixture.records[write.entityId] ??= [];
    const record = list.find(candidate => candidate.recordId === write.recordId);
    if (write.op === 'delete') {
      const kept = deletedIds.get(write.recordId);
      if (record !== undefined || kept === undefined || kept.restored || kept.version !== write.version)
        throw refusal('deletion-state-conflict', 'This record is no longer in the selected deleted state.');
      for (const fieldId of referenceFields(write.entityId)) {
        const target = kept.values[fieldId];
        if (target !== undefined && target !== null && findRecord(target) === undefined)
          throw refusal('target-not-found', 'That record does not exist in the reference\u2019s target type.');
      }
      list.push({ entityId: write.entityId, recordId: write.recordId, version: write.version + 1, values: clone(kept.values) });
      kept.restored = true;
      log.push({ op: 'restore', entityId: write.entityId, recordId: write.recordId, version: write.version + 1 });
      return;
    }
    if (record === undefined) throw refusal('record-not-found', 'The record no longer exists.');
    if (record.version !== (carried ?? write.version)) throw refusal('record-version-conflict', 'The record changed. Review its current values.');
    if (write.op === 'update') {
      const before = Object.fromEntries(Object.keys(write.before).map(fieldId => [fieldId, record.values[fieldId] ?? null]));
      for (const fieldId of referenceFields(write.entityId)) {
        const target = write.before[fieldId];
        if (target !== undefined && target !== null && findRecord(target) === undefined)
          throw refusal('target-not-found', 'That record does not exist in the reference’s target type.');
      }
      record.values = { ...record.values, ...clone(write.before) };
      record.version += Object.keys(write.before).length;
      log.push({ op: 'update', entityId: write.entityId, recordId: write.recordId, before, version: record.version });
      return;
    }
    // A create or a restore is answered by deleting the record again.
    const version = record.version, values = clone(record.values);
    deleteKept(write.entityId, record);
    log.push({ op: 'delete', entityId: write.entityId, recordId: write.recordId, version, values });
  }

  /** The reference fields of a record type, from the fixture's schema. */
  function referenceFields(entityId) {
    const entity = (fixture.schema?.entities ?? []).find(candidate => candidate.entityId === entityId);
    return (entity?.fields ?? []).filter(field => field.storageKind === 'reference').map(field => field.fieldId);
  }

  function findRecord(recordId) {
    for (const list of Object.values(fixture.records)) {
      const record = list.find(candidate => candidate.recordId === recordId);
      if (record !== undefined) return record;
    }
    return undefined;
  }

  function writeOne(entry, touched, log = []) {
    const entityId = text(entry, 'entityId');
    const list = fixture.records[entityId] ??= [];
    const checkTargets = (values, targetVersions) => {
      for (const fieldId of referenceFields(entityId)) {
        const target = values?.[fieldId];
        if (target === undefined || target === null) continue;
        const record = findRecord(target);
        if (record === undefined) throw refusal('target-not-found', 'That record does not exist in the reference\u2019s target type.');
        const expected = touched.has(target) ? touched.get(target) : targetVersions?.[fieldId];
        if (expected === undefined) throw refusal('target-version-required', 'Select the target again so its current version can be checked.');
        if (record.version !== expected) throw refusal('target-version-conflict', 'The selected target changed. Select it again before saving.');
      }
    };
    if (entry.op === 'create') {
      const recordId = entry.recordId ?? `record-${crypto.randomUUID().replaceAll('-', '')}`;
      if (findRecord(recordId) !== undefined) throw refusal('record-exists', 'That record ID is already used.');
      if (deletedIds.has(recordId)) throw refusal('record-id-reserved', 'This record ID is retained in deletion history and cannot be reused.');
      checkTargets(entry.values, entry.targetVersions);
      const record = { entityId, recordId, version: 1, values: clone(entry.values ?? {}) };
      list.push(record);
      touched.set(recordId, 1);
      log.push({ op: 'create', entityId, recordId, version: 1 });
      return record;
    }
    const record = list.find(candidate => candidate.recordId === entry.recordId);
    if (record === undefined) throw refusal('record-not-found', 'That record is not in this file.');
    if (record.version !== entry.version) throw refusal('record-version-conflict', 'The record changed. Review its current values.');
    if (entry.op === 'update') {
      checkTargets(entry.values, entry.targetVersions);
      const before = Object.fromEntries(Object.keys(entry.values ?? {}).map(fieldId => [fieldId, record.values[fieldId] ?? null]));
      record.values = { ...record.values, ...clone(entry.values ?? {}) };
      record.version += Object.keys(entry.values ?? {}).length;
      touched.set(record.recordId, record.version);
      log.push({ op: 'update', entityId, recordId: record.recordId, before, version: record.version });
      return record;
    }
    const values = clone(record.values), version = record.version;
    deleteKept(entityId, record);
    touched.delete(record.recordId);
    log.push({ op: 'delete', entityId, recordId: record.recordId, version, values });
    return { ...record, deleted: true };
  }

  function receive(message) {
    if (typeof message !== 'object' || message === null) return;
    if (message.t === 'ping') { post({ t: 'pong', id: message.id }); return; }
    if (message.t === 'pong') { pongs.push(message.id); return; }
    if (message.t !== 'req' || typeof message.id !== 'number') return;
    const params = message.p ?? {};
    requests.push({ m: message.m, p: clone(params), t: now() });
    let reply;
    try {
      const result = answer(message.m, params);
      reply = { t: 'res', id: message.id, ok: true, r: result === undefined ? null : result };
    } catch (error) {
      reply = { t: 'res', id: message.id, ok: false, e: { code: error.code ?? 'failed', message: error.message } };
    }
    const dropped = takeOne(drops, message.m);
    if (dropped !== null) reply = { t: 'res', id: message.id, ok: false, e: clone(dropped.error) };
    const held = takeOne(holds, message.m);
    if (held !== null) setTimeout(() => post(reply), held.ms); else post(reply);
  }

  function takeOne(list, method) {
    const index = list.findIndex(entry => entry.method === method);
    if (index === -1) return null;
    const entry = list[index];
    entry.times -= 1;
    if (entry.times <= 0) list.splice(index, 1);
    return entry;
  }

  function mount() {
    // A frame mounted again starts with nothing it may undo, as the Workbench's broker keeps it.
    revisions = new Map();
    if (port !== null) { port.close(); port = null; }
    if (frame !== null) frame.remove();
    frame = document.createElement('iframe');
    frame.name = 'nendo-view-fixture';
    frame.title = fixture.context.title ?? 'Custom view';
    frame.setAttribute('sandbox', SANDBOX);
    frame.setAttribute('allow', ALLOW);
    frame.src = config.viewUrl;
    document.body.append(frame);
  }

  // Only the frame this page mounted, and only from the origin it was mounted at, is connected.
  window.addEventListener('message', event => {
    const data = event.data;
    if (typeof data !== 'object' || data === null || data.nendo !== 'hello') return;
    if (frame === null || event.source !== frame.contentWindow) { refused.push('not the mounted frame'); return; }
    if (event.origin !== config.viewOrigin) { refused.push('origin ' + event.origin); return; }
    hellos.push(data.apiVersion);
    if (port !== null) port.close();
    const channel = new MessageChannel();
    port = channel.port1;
    port.onmessage = message => receive(message.data);
    connects += 1;
    event.source.postMessage({ nendo: 'connect', apiVersion: config.apiVersion, context: contextOf() }, config.viewOrigin, [channel.port2]);
  });

  window.broker = Object.freeze({
    viewOrigin: config.viewOrigin,
    apiVersion: config.apiVersion,
    themes,
    requests, events, hellos, refused, pongs,
    get connects() { return connects; },
    /** Replace what the view reads. Each fixture is a new change of the file. The first one mounts the frame. */
    setFixture(next) {
      fixture = { ...clone(next), changeSequence: (fixture?.changeSequence ?? 0) + 1 };
      deletedIds = new Map();
      if (frame === null) mount();
      return fixture.changeSequence;
    },
    pushChanges() { emit('changes', fixture.changeSequence); return events.length; },
    /** A mode ('light' or 'dark') takes the Workbench's own tokens; an object is sent as it is. */
    pushTheme(theme) {
      const value = themeOf(theme);
      fixture.context = { ...fixture.context, theme: value };
      emit('theme', value);
      return events.length;
    },
    pushContext() { emit('context', contextOf()); return events.length; },
    fail(method, error, times = 1) { failures.push({ method, error: clone(error), times }); return true; },
    hold(method, ms, times = 1) { holds.push({ method, ms, times }); return true; },
    drop(method, error, times = 1) { drops.push({ method, error: clone(error), times }); return true; },
    remount() { mount(); return true; },
    offerChrome(on) { chrome = on === true; return chrome; },
    offerWrites(on) { writes = on === true; return writes; },
    offerPlaces(on) { placesOffered = on === true; return placesOffered; },
    offerSearch(on) { searchOffered = on === true; return searchOffered; },
    offerScreens(on) { screensOffered = on === true; return screensOffered; },
    screensOpened() { return requests.filter(request => request.m === 'ui.openScreen').map(request => request.p.surfaceId); },
    places,
    /** Back or Forward moved the person to this place of the view's. */
    pushPlace(place) { emit('place', clone(place)); return events.length; },
    /** The place the view's next connect starts from, as a view started again after Back finds it. */
    startAt(place) { startPlace = clone(place); return true; },
    records(entityId) { return clone(fixture.records[entityId] ?? []); },
    toolbars, menus, chromeRefusals,
    pickNext(pick) { menuPick = clone(pick); return true; },
    command(id, value = null, source = 'toolbar') { emit('command', { id, value, source }); return events.length; },
    ping() { const id = nextPing++; post({ t: 'ping', id }); return id; },
    opened() { return requests.filter(request => request.m === 'ui.openRecord').map(request => request.p); },
    commandsRun() { return requests.filter(request => request.m === 'commands.run').map(request => request.p); },
    /** A record as the fixture now holds it, to see what a command did. */
    record(entityId, recordId) { return clone((fixture.records[entityId] ?? []).find(candidate => candidate.recordId === recordId) ?? null); },
    /** Somebody else writes a record, new or a version of one the fixture holds; pushChanges() tells the view. */
    put(entityId, record) {
      const list = fixture.records[entityId] ??= [];
      const at = list.findIndex(candidate => candidate.recordId === record.recordId);
      if (at >= 0) list[at] = clone(record); else list.push(clone(record));
      fixture.changeSequence += 1;
      return fixture.changeSequence;
    },
    /** Somebody else changes a record: its version moves on under the view. */
    touch(entityId, recordId) {
      const record = (fixture.records[entityId] ?? []).find(candidate => candidate.recordId === recordId);
      record.version += 1; fixture.changeSequence += 1;
      return record.version;
    },
  });
})();
</script>
</body>
</html>
