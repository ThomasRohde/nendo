<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>D · Chip and preview pane</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#005fb8}a:hover{color:#004a8f}
</style>
</helmet>
<div style="width: 1440px; height: 1060px; box-sizing: border-box; background: {{c.canvas}}; color: {{c.ink}}; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; font-size: 14px; display: grid; grid-template-columns: 820px 1fr; gap: 24px; padding: 28px">

<section aria-label="Record page" style="background: {{c.surface}}; border: 1px solid {{c.line}}; border-radius: 8px; display: grid; grid-template-columns: 1fr 300px">
  <div style="padding: 24px 28px; display: flex; flex-direction: column; gap: 16px; border-right: 1px solid {{c.line}}">
    <div style="display: flex; gap: 8px; color: {{c.muted}}; font-size: 13px"><span>Albums</span><span aria-hidden="true">›</span><span style="color: {{c.ink}}">Blue Harbour</span></div>
    <h1 style="margin: 0; font-size: 26px; font-weight: 600">Blue Harbour</h1>
    <div style="display: grid; grid-template-columns: 120px 1fr; row-gap: 12px; column-gap: 16px; align-items: center">
      <div style="color: {{c.muted}}">Artist</div>
      <div style="border: 1px solid {{c.line}}; border-radius: 4px; padding: 6px 10px">Marta Lind</div>
      <div style="color: {{c.muted}}">Cover</div>
      <button type="button" aria-pressed="true" style="display: flex; gap: 10px; align-items: center; text-align: left; border: 1.5px solid {{c.accent}}; background: {{c.accentSoft}}; color: {{c.ink}}; border-radius: 6px; padding: 6px 8px">
        <span style="width: 36px; height: 36px; border-radius: 4px; background: {{c.pic1}}; display: inline-block"></span>
        <span style="display: flex; flex-direction: column"><span style="font-weight: 600">front.jpg</span><span style="font-size: 12px; color: {{c.muted}}">In file · 1.2 MB</span></span>
      </button>
      <div style="color: {{c.muted}}">Back cover</div>
      <button type="button" style="display: flex; gap: 10px; align-items: center; text-align: left; border: 1px solid {{c.line}}; background: {{c.surface}}; color: {{c.ink}}; border-radius: 6px; padding: 6px 8px">
        <span style="width: 36px; height: 36px; border-radius: 4px; background: {{c.pic4}}; display: inline-block"></span>
        <span style="display: flex; flex-direction: column"><span style="font-weight: 600">tide-back.jpg</span><span style="font-size: 12px; color: {{c.muted}}">Web · example.org</span></span>
      </button>
      <div style="color: {{c.muted}}">Booklet scan</div>
      <button type="button" style="display: flex; gap: 10px; align-items: center; text-align: left; border: 1px solid {{c.line}}; background: {{c.soft}}; color: {{c.ink}}; border-radius: 6px; padding: 6px 8px">
        <span style="width: 36px; height: 36px; border-radius: 4px; border: 1.5px dashed {{c.warning}}; box-sizing: border-box; display: inline-block"></span>
        <span style="display: flex; flex-direction: column"><span style="font-weight: 600; color: {{c.warning}}">Not found</span><span style="font-size: 12px; color: {{c.muted}}; font-family: Consolas, monospace">..\Scans\booklet-01.jpg</span></span>
      </button>
      <div style="color: {{c.muted}}">Poster</div>
      <button type="button" style="border: 1.5px dashed {{c.lineStrong}}; background: transparent; color: {{c.muted}}; border-radius: 6px; padding: 12px; text-align: left">Add a picture…</button>
    </div>
  </div>
  <aside aria-label="Cover preview" style="padding: 18px; display: flex; flex-direction: column; gap: 12px; background: {{c.soft}}">
    <div style="font-weight: 600">Cover</div>
    <div style="height: 260px; border-radius: 6px; background: {{c.pic1}}; border: 1px solid {{c.line}}">
      <svg viewBox="0 0 264 260" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><circle cx="196" cy="70" r="26" fill="{{c.pic2}}"></circle><path d="M0 260 L80 140 L140 210 L196 120 L264 260 Z" fill="{{c.pic3}}"></path></svg>
    </div>
    <div style="color: {{c.muted}}; font-size: 12.5px">front.jpg · 1.2 MB · 1200 × 1200 · In file</div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <button type="button" style="text-align: left; border: 1px solid {{c.lineStrong}}; background: {{c.surface}}; color: {{c.ink}}; border-radius: 4px; padding: 7px 10px">Replace…</button>
      <button type="button" style="text-align: left; border: 1px solid {{c.lineStrong}}; background: {{c.surface}}; color: {{c.ink}}; border-radius: 4px; padding: 7px 10px">Link to a file instead…</button>
      <button type="button" style="text-align: left; border: 1px solid {{c.lineStrong}}; background: {{c.surface}}; color: {{c.ink}}; border-radius: 4px; padding: 7px 10px">Web address…</button>
      <button type="button" style="text-align: left; border: 1px solid {{c.lineStrong}}; background: {{c.surface}}; color: {{c.ink}}; border-radius: 4px; padding: 7px 10px">Open larger</button>
      <button type="button" style="text-align: left; border: 1px solid {{c.lineStrong}}; background: {{c.surface}}; color: {{c.danger}}; border-radius: 4px; padding: 7px 10px">Remove from record</button>
    </div>
  </aside>
</section>

<div style="display: flex; flex-direction: column; gap: 20px; min-width: 0">
  <section aria-label="List" style="background: {{c.surface}}; border: 1px solid {{c.line}}; border-radius: 8px; overflow: hidden">
    <div style="padding: 10px 14px; font-weight: 600; border-bottom: 1px solid {{c.line}}">Albums · list</div>
    <sc-for list="{{rows}}" as="row" hint-placeholder-count="3">
      <div style="display: grid; grid-template-columns: 28px 1fr 140px; gap: 10px; align-items: center; padding: 8px 14px; border-bottom: 1px solid {{c.line}}">
        <div style="width: 28px; height: 28px; border-radius: 3px; background: {{row.fill}}"></div>
        <span>{{row.title}}</span><span style="color: {{c.muted}}">{{row.artist}}</span>
      </div>
    </sc-for>
  </section>
  <section aria-label="Gallery" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
    <sc-for list="{{rows}}" as="row" hint-placeholder-count="3">
      <div style="background: {{c.surface}}; border: 1px solid {{c.line}}; border-radius: 8px; overflow: hidden">
        <div style="height: 120px; background: {{row.fill}}"></div>
        <div style="padding: 8px 10px"><div style="font-weight: 600">{{row.title}}</div><div style="color: {{c.muted}}; font-size: 12.5px">{{row.artist}}</div></div>
      </div>
    </sc-for>
  </section>
  <section aria-label="Studio" style="background: {{c.surface}}; border: 1px solid {{c.line}}; border-radius: 8px; overflow: hidden; font-size: 13px">
    <div style="display: grid; grid-template-columns: 1fr 1.6fr; background: {{c.soft}}; font-weight: 600"><div style="padding: 6px 10px">Title</div><div style="padding: 6px 10px">Cover</div></div>
    <div style="display: grid; grid-template-columns: 1fr 1.6fr; border-top: 1px solid {{c.line}}"><div style="padding: 6px 10px">Blue Harbour</div><div style="padding: 6px 10px; display: flex; gap: 8px; align-items: center"><span style="width: 22px; height: 22px; border-radius: 3px; background: {{c.pic1}}; display: inline-block"></span><span style="font-family: Consolas, monospace; color: {{c.muted}}">media:3f9a…c1e2</span></div></div>
  </section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":1060}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const c = dark
      ? { canvas: '#272829', surface: '#2d2e30', soft: '#38393b', ink: '#ffffff', muted: '#c5c5c5', line: '#3b3c3e', lineStrong: '#4b4c4f', accent: '#60cdff', accentSoft: '#1f3a4a', warning: '#e9b659', danger: '#f37b72', pic1: '#33485a', pic2: '#c9a03b', pic3: '#4f6b84', pic4: '#5a4a3b' }
      : { canvas: '#f9f9fa', surface: '#ffffff', soft: '#f3f3f4', ink: '#1b1b1b', muted: '#5d5d5d', line: '#e5e5e5', lineStrong: '#d1d1d1', accent: '#005fb8', accentSoft: '#e5eff9', warning: '#9c6400', danger: '#c23a31', pic1: '#c9d6e3', pic2: '#f2c14e', pic3: '#5b7c99', pic4: '#d8c3a5' };
    const rows = [
      { title: 'Blue Harbour', artist: 'Marta Lind', fill: c.pic1 },
      { title: 'Tide Lines', artist: 'Oskar Berg', fill: c.pic4 },
      { title: 'North Light', artist: 'Ida Holm', fill: c.pic3 },
    ];
    return { c, rows };
  }
}
</script>
</body>
</html>
